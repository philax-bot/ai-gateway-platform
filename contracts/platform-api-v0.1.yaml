openapi: 3.1.0
info:
  title: Signal Atlas Business API
  version: 0.1.0
  description: Single enterprise workspace. Authenticated fixed responsibilities; all money writes use the control-plane ledger transaction.
servers:
  - url: http://127.0.0.1:4001
paths:
  # guardrail.update is an operator-only previewed platform command:
  # expectedVersion, mode(off|observe|block), modelIds(null for all or nonempty list),
  # presets(phone|identity_card|api_key), words(<=200; 2..128 chars; <=16KiB), reason.
  # Advances policy version once; initial missing policy is off/version 0.
  /api/v1/platform/safety/query:
    post:
      summary: Read operator-only input guardrail policy and metadata events
      security: [{sessionCookie: []}]
      description: Accepts optional from/to timestamps with timezone, modelId, subjectId, requestId, category, action, limit (1-100) and before cursor. Returns policy, items, nextCursor and filtered block/observe counts. Never returns matched input.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Saved policy plus paginated metadata; initial mode is off}
        '400': {description: Invalid filter or cursor}
        '403': {description: Operator required}
  /api/v1/platform/safety/trial:
    post:
      summary: Try saved rules on synthetic text without generation or persistence
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId, text]
              properties:
                modelId: {type: string}
                text: {type: string, maxLength: 16384}
      responses:
        '200': {description: Rule identifiers, categories, version, optional scan-limit error; inputOnly true and modelCalled false. Off mode still permits trial; model scope still applies. No trial event or input is stored.}
        '400': {description: Invalid trial input}
        '403': {description: Operator required}
  /api/v1/platform/local-octop/imports:
    post:
      security: [{sessionCookie: []}]
      description: Creates a five-minute, single-use handoff to the user's locally installed Octop. Requires the owner's active existing API Key value and current platform session. Does not issue a new Key. Gateway URL and authorized text models are derived on the server. Returns id, expiresAt and a signal-octop URI containing only a random ticket. API Key and payload stay in bounded process memory, never in the launch URI or workspace state. Recreating an import for the same Key invalidates the older ticket. Requires a single control-plane process (or sticky routing); restart invalidates pending imports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [keyId, apiKey]
              properties:
                keyId: {type: string}
                apiKey: {type: string, maxLength: 512, writeOnly: true}
      responses:
        '200': {description: Uncached id, expiresAt and ticket-only launch URL}
        '401': {description: Session or supplied API Key invalid}
        '404': {description: Key missing or not owned by caller}
        '409': {description: Key/model unavailable or pending-import limit reached}
  /api/v1/platform/local-octop/imports/{id}:
    get:
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      description: Owner-only progress. Status is pending, claimed, completed or failed. Completed means the local connector reported success, not a model-call or billing acceptance. No credentials returned. Expired records return 404.
      responses:
        '200': {description: Uncached progress and expiration}
        '404': {description: Import missing, expired or outside actor scope}
  /api/v1/platform/local-octop/imports/claim:
    post:
      description: Native connector exchanges a 43-character capability ticket in the POST body. No platform cookie is needed. Checks original platform session, membership, Key status and model scope again. A ticket can only be claimed once. Uncached response carries config and a separate one-use completion receipt; keep request and response bodies out of logs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [ticket], properties: {ticket: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true}}}
      responses:
        '200': {description: Import configuration, id, expiresAt and one-use receipt}
        '410': {description: Ticket expired/used or original authorization changed}
  /api/v1/platform/local-octop/imports/complete:
    post:
      description: Native connector reports completed or failed using its one-use completion receipt. It does not extend the five-minute TTL or reactivate the Key. No session cookie required. This is a connector self-report, not device attestation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, receipt, status]
              properties:
                id: {type: string}
                receipt: {type: string, writeOnly: true}
                status: {type: string, enum: [completed, failed]}
      responses:
        '200': {description: Result recorded}
        '410': {description: Receipt expired, invalid or already used}
  /api/v1/platform/agent-instances/self/chat:
    post:
      security: [{sessionCookie: []}]
      description: Local-development platform-session bridge to the caller's running Octop instance. Accepts text and an optional owned threadId only. Native credentials and runtime selection stay on the server. One active turn per instance, with a 180-second ceiling. A process-local lifecycle lock rejects start/stop/rotation/access-reset operations with 409 until the turn and cancellation cleanup finish. Cancellation callbacks are bound to the original instance generation and become inactive when the turn releases its lock. Logout immediately requests cancellation; membership, session and instance generation are checked every second. Client disconnect explicitly cancels the native turn; an unacknowledged cancellation attempts to revoke the dedicated Key and stop this owned runtime. Runtime stop is still attempted if the revocation transaction fails. Cancellation does not imply zero charges. No automatic retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 16000}
                threadId: {type: string, maxLength: 200, pattern: '^[-A-Za-z0-9_:]+$'}
      responses:
        '200':
          description: Uncached SSE data objects. Types are session (threadId), token (content), tool (generic message), error (safe message), and done (cancelled). Setup failure can end with error only. Raw native state, tool arguments/results, Provider config, URLs and tokens are not forwarded.
          content:
            text/event-stream:
              schema: {type: string}
        '400': {description: Invalid text, fields or conversation identity}
        '401': {description: Platform session expired or missing}
        '403': {description: Member or organization inactive}
        '409': {description: Instance unavailable or another turn is active}
  /api/v1/platform/agent-instances/self:
    get:
      security: [{sessionCookie: []}]
      description: Local-development managed Octop status for the current stable platform member. Returns enabled and an optional instance view; excludes raw API Keys, admin credentials, runtime paths and operation leases. No process is created by a read.
      responses:
        '200': {description: ManagedAgentView}
        '401': {description: Current active platform session required}
  /api/v1/platform/agent-instances/{id}:
    get:
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      description: Owner or operator view. Missing and foreign instances both return 404.
      responses:
        '200': {description: ManagedAgentView}
        '404': {description: Instance not found in current actor scope}
  /api/v1/platform/agent-instances/self/ensure:
    post:
      security: [{sessionCookie: []}]
      description: Explicitly enabled local development only. Derives owner from the current platform session. Creates or starts the dedicated instance and delivers a newly signed personal Key server-side. The only accepted body field is idempotencyKey. An already healthy running instance is reused. Network and process work run outside the workspace transaction. Failed or ambiguous delivery revokes the new Key; retry with a fresh idempotency key. Does not implement SSO or production sandboxing.
      requestBody: {$ref: '#/components/requestBodies/ManagedAgentOperation'}
      responses:
        '200': {description: Current instance view; raw Key is never returned}
        '400': {description: Invalid body or client-supplied ownership/runtime configuration}
        '409': {description: In progress, idempotency conflict or recoverable operation failure}
        '503': {description: Local managed runtime disabled}
  /api/v1/platform/agent-instances/{id}/rotate-key:
    post:
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      description: Owner or operator. Immediately revokes the old dedicated Key before creating and installing a replacement. Existing unrelated client Keys are unaffected. Brief interruption is expected. On delivery failure the replacement is revoked and the instance is stopped when possible.
      requestBody: {$ref: '#/components/requestBodies/ManagedAgentOperation'}
      responses:
        '200': {description: Current instance view}
        '404': {description: Instance outside current actor scope}
        '409': {description: Busy, conflict or recoverable failure}
        '503': {description: Local managed runtime disabled}
  /api/v1/platform/agent-instances/{id}/stop:
    post:
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      description: Owner or operator. Revokes the instance Key before stopping only its owned process tree. Preserves workspace and mapping for restart. Stopping another member's instance is operator-only; operators cannot obtain that member's login credentials.
      requestBody: {$ref: '#/components/requestBodies/ManagedAgentOperation'}
      responses:
        '200': {description: Stopped view, or replay of the current view}
        '404': {description: Instance outside current actor scope}
        '409': {description: Busy or recoverable stop failure}
        '503': {description: Local managed runtime disabled}
  /api/v1/platform/agent-instances/{id}/access:
    post:
      security: [{sessionCookie: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      description: Deprecated local diagnostic export. Disabled by default unless the server explicitly enables OCTOP_LEGACY_LOGIN_ENABLED=true. Owner-only reset returning the ordinary Octop username/password plus loginUrl with Cache-Control no-store. Native JWTs bypass the platform bridge and are not revoked by platform logout. Keep disabled for the platform UI path. Password is not retained in workspace, audit or idempotent results. Never returns administrator credentials.
      responses:
        '200': {description: Ordinary-user loginUrl, username and newly reset password}
        '404': {description: Caller is not the instance owner, including operators}
        '409': {description: Legacy login export disabled, instance stopped or operation pending}
        '503': {description: Local managed runtime disabled}
  /api/v1/auth/bootstrap:
    get:
      responses:
        '200': {description: Whether initial workspace setup is required}
  /api/v1/auth/setup:
    post:
      description: First operator setup only. Remote setup requires configured BOOTSTRAP_TOKEN. Password must have 12 to 256 characters.
      responses:
        '200': {description: Workspace initialized}
        '400': {description: Already initialized or invalid input}
        '403': {description: Remote bootstrap token required}
  /api/v1/auth/login:
    post:
      description: Login with directoryId and password. Sets HttpOnly SameSite session cookie. Raw token is never in the JSON body.
      responses:
        '200': {description: Authenticated member metadata}
        '401': {description: Invalid credentials or throttled}
  /api/v1/platform/state:
    get:
      security: [{sessionCookie: []}]
      description: Role-scoped resources, quotas and budgets. Excludes passwords, session hashes, key hashes and plaintext keys.
      responses:
        '200': {description: Workspace state for the current actor}
        '401': {description: Login required}
  /api/v1/platform/preview:
    post:
      security: [{sessionCookie: []}]
      description: Non-mutating impact preview. Returns a short-lived actor/payload/revision bound token. Does not grant or transfer quota.
      responses:
        '200': {description: Impact and preview token}
  /api/v1/platform/commands:
    post:
      security: [{sessionCookie: []}]
      description: Validated business command. Idempotency keys cannot be reused for a different actor or payload. Sensitive mutations require a preview token. Amounts support six decimals and timestamps must explicitly include timezone. entitlements.migrate moves up to 200 selected entitlements of the same plan to its current version without changing once/monthly cadence; it preserves balance, expiry, source and issued periods, never backfills quota, and rejects inapplicable objects unless a new preview is requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, idempotencyKey, payload]
              properties:
                type: {type: string}
                idempotencyKey: {type: string, minLength: 8}
                payload: {type: object}
                expectedRevision: {type: integer}
                previewToken: {type: string}
      responses:
        '200': {description: Command result; newly signed key secret appears only in its original successful response}
        '400': {description: Invalid business input}
        '401': {description: Login required}
        '403': {description: Actor has no responsibility for this object}
        '409': {description: Stale preview, reused key or conflicting business state}
  /api/v1/auth/me:
    get:
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Current active member metadata}
        '401': {description: Invalid session}
        '403': {description: Disabled or expired member}
  /api/v1/auth/logout:
    post:
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Session and its issued online identities revoked; cookie cleared. Other sessions and ordinary API Keys retain their independent access.}
  /api/v1/platform/services/{id}/verify:
    post:
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      description: 'Operator-only actual HTTP model check. External addresses are disabled unless ALLOW_UPSTREAM_VALIDATION is explicitly enabled. Redirects are refused. This is platform diagnostic traffic funded by the platform: it records a verification run with per-mapping usage, price snapshot and internal cost estimate, but never reserves or charges employee, project or application quota and never enters call statistics. A stable idempotencyKey returns the original run without another upstream request. Only one running verification per service is allowed; a stale lease becomes interrupted with usage unknown and is never resent. A changed configuration cannot reuse an earlier verification result.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey: {type: string, minLength: 8, maxLength: 160, description: Stable per page action; a deliberate re-verification uses a new key.}
      responses:
        '200': {description: 'Current service fields plus verificationRun, verificationApplied and replayed. verificationApplied is false when the configuration changed during the run; the old run remains evidence but is never written as the current configuration passing.'}
        '403': {description: No operator responsibility or external validation disabled}
        '409': {description: Another verification is running, or the credential reference is not configured}
        '503': {description: The run executed but its metering record could not be saved}
  /api/v1/platform/services/{id}/verifications:
    get:
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: before, required: false, schema: {type: string, format: date-time}}
      description: Operator-only paged verification history for one service, newest first. Diagnostic records are excluded from employee call statistics, model business alert denominators and employee call history by default.
      responses:
        '200': {description: Verification runs with per-mapping usage, price snapshot and internal cost state}
        '400': {description: Invalid page size or cursor}
        '403': {description: No operator responsibility}
  /api/v1/platform/calls/{requestId}:
    get:
      security: [{sessionCookie: []}]
      parameters:
        - {in: path, name: requestId, required: true, schema: {type: string}}
      description: Operator or scoped owner read of one call and its explicit retries. Applies the server-side subject/application scope before returning; out-of-scope calls are not revealed. Never returns prompts or completion content.
      responses:
        '200': {description: '{ original: CallLog|null, retries: CallLog[] } within the actor scope'}
        '400': {description: Invalid request ID}
        '401': {description: Login required}
  /api/v1/platform/online-credential:
    post:
      security: [{sessionCookie: []}]
      description: Issue an internal purpose-bound online identity bound server-side to the issuing login session, valid for at most five minutes and never beyond that session expiry. Logout revokes identities from that session only. No user-created API key is required. The transient token is not persisted in plaintext or included in the user's key list; its private session linkage is never returned.
      responses:
        '200': {description: Transient token and expiry for the authenticated actor's personal or project purpose}
        '401': {description: Login required or issuing session expired before identity creation}
        '409': {description: No open authorized model in this purpose}
  /api/v1/platform/quote:
    post:
      security: [{sessionCookie: []}]
      description: Quote a personal or project chat request against current source batches without reserving money or rate capacity. Uses the same transport-size input estimate as the gateway. Returns source, maximum output, price version and reservation amount; the final authorization rechecks all conditions. Online clients pin the returned price version with x-price-version.
      responses:
        '200': {description: Allow with quote metadata, or a reason-specific deny}
        '400': {description: Invalid chat input or purpose}
  /api/v1/platform/maintenance/run:
    post:
      security: [{sessionCookie: []}]
      description: Operator-triggered execution of the same monthly/expiry maintenance worker. Monthly grants are unique per member plan snapshot and Shanghai calendar period. Expiry retains unknown holds for review; it never assumes zero usage. Also runs automatically at startup and periodically.
      responses:
        '200': {description: Counts of newly issued batches and expired reservations marked for review}
        '403': {description: Operator responsibility required}
components:
  requestBodies:
    ManagedAgentOperation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [idempotencyKey]
            properties:
              idempotencyKey: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$'}
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: signal_session
