worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/signal-atlas/tls/fullchain.pem;
        ssl_certificate_key /etc/signal-atlas/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        location = /health { access_log off; return 200 'ok'; }
        location ^~ /internal/ { return 404; }
        location ^~ /api/ {
            proxy_pass http://control-plane:4001;
            proxy_read_timeout 65s;
        }
        location ^~ /v1/ {
            proxy_pass http://gateway:4000;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=31536000, immutable';
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control 'no-store';
        }
    }
}
