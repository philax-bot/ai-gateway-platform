services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_gateway
      POSTGRES_USER: ai_gateway
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "54329:5432"
    volumes:
      - ai_gateway_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
volumes:
  ai_gateway_postgres:
